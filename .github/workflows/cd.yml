name: Continuous Deployment

on:
  workflow_run:
    workflows: ["CI Workflow"]
    branches: [main]
    types:
      - completed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Only run if the CI workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        # To use this, configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in your GitHub repository secrets
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/edusphere-backend:latest,${{ secrets.DOCKERHUB_USERNAME }}/edusphere-backend:${{ github.sha }}

      # Example: Deploying to a production server via SSH
      # Uncomment and configure this block when your production server is ready
      # Port is 3000 throughout — it must match EXPOSE in the Dockerfile, the
      # container HEALTHCHECK, PORT in .env.example, and docker-compose.yml.
      # A published port that disagrees with the listener yields a container
      # that starts, serves nothing reachable, and fails every probe.
