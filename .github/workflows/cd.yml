name: Continuous Deployment

on:
  workflow_run:
    workflows: ["CI Workflow"]
    branches: [main]
    types:
      - completed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Only run if the CI workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        # To use this, configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in your GitHub repository secrets
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/edusphere-backend:latest,${{ secrets.DOCKERHUB_USERNAME }}/edusphere-backend:${{ github.sha }}

      - name: Deploy to Production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            export API_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/edusphere-backend:latest
            # Pull the new image
            docker compose -f docker-compose.prod.yml pull api
            # Run migrations on the new image BEFORE it serves traffic
            docker compose -f docker-compose.prod.yml run --rm api npx prisma migrate deploy
            # Recreate the container with the new image
            docker compose -f docker-compose.prod.yml up -d api

      - name: Smoke test deployed health endpoint
        run: |
          sleep 15
          curl --fail --retry 3 --retry-delay 5 http://${{ secrets.PROD_SERVER_HOST }}:3000/health
