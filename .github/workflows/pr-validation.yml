name: PR Validation

on:
  pull_request:
    branches: ["main", "dev"]
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Define which types are allowed
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Scope is not required (e.g., "feat: Add authentication" is fine)
          requireScope: false
          # Custom validation error message
          headerPattern: '^(\w*)(?:\(([\w$.\-*/ ]*)\))?: (.*)$'
          headerPatternCorrespondence: type, scope, subject

  # The image is otherwise built only by cd.yml, which runs after CI succeeds on
  # main. That leaves every Dockerfile defect invisible on PRs and on dev, to
  # surface after merge in the deploy pipeline behind a green CI. Building here
  # moves that failure onto the PR that causes it.
  docker-build:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # push: false — this gate proves the image builds; cd.yml owns publishing.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: edusphere-backend:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build success does not prove the runtime stage is intact: a missing
      # Prisma client or a devDependency-only import fails at import time, not at
      # build time. Importing the client is the cheapest assertion that the
      # generate output survived the multi-stage copy.
      - name: Verify runtime stage
        run: |
          docker run --rm --entrypoint node \
            edusphere-backend:pr-${{ github.event.pull_request.number }} \
            -e "import('@prisma/client').then(m => { if (!m.PrismaClient) { throw new Error('PrismaClient missing from generated client'); } console.log('prisma client OK'); })"
          echo "--- non-root check ---"
          test "$(docker run --rm --entrypoint id edusphere-backend:pr-${{ github.event.pull_request.number }} -un)" = "nodeapp"
          echo "runs as nodeapp OK"
          echo "--- devDependencies absent ---"
          for pkg in vitest supertest eslint prettier; do
            if docker run --rm --entrypoint test edusphere-backend:pr-${{ github.event.pull_request.number }} -d "/app/node_modules/$pkg"; then
              echo "::error::devDependency $pkg shipped to the runtime image"
              exit 1
            fi
          done
          echo "no devDependencies in runtime image OK"

  build-and-test:
    name: CI Pipeline (Lint, Test, Coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edusphere_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: error
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      SWAGGER_ENABLED: false
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edusphere_test_db?schema=public
      REDIS_URL: redis://localhost:6379
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/edusphere_test_db?schema=public
      REDIS_URL_TEST: redis://localhost:6379/1
      JWT_SECRET: ci_test_jwt_access_secret_key_min_32_chars
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_min_32_chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      STORAGE_PROVIDER: s3
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: test-bucket
      EMAIL_PROVIDER: brevo
      EMAIL_API_KEY: test_api_key
      EMAIL_FROM: noreply@test.local
      EMAIL_FROM_NAME: EduSphere Test
      EMAIL_WEBHOOK_SECRET: ci_test_webhook_hmac_secret

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter (Gate)
      run: npm run lint

    - name: Generate Prisma client
      run: npx prisma generate

    - name: Run database migrations
      run: npx prisma migrate deploy

    - name: Run Tests
      run: npm run test:run

    - name: Run Coverage
      run: npm run test:coverage
