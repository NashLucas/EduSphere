name: CI Workflow

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edusphere_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      LOG_LEVEL: error
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      SWAGGER_ENABLED: false
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edusphere_test_db?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0
      JWT_SECRET: ci_test_jwt_access_secret_key_min_32_chars
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_min_32_chars
      JWT_REFRESH_EXPIRES_IN: 7d
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: test-bucket
      BREVO_API_KEY: test_api_key
      BREVO_SENDER_EMAIL: noreply@test.local
      BREVO_SENDER_NAME: EduSphere Test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate

    - name: Run database migrations
      run: npx prisma migrate deploy

    - name: Seed test database
      run: npm run db:seed

    - name: Run Linter
      run: npm run lint

    - name: Run Tests & Coverage
      run: npm run test:run
