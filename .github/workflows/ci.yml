name: CI Workflow

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edusphere_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Reconciled to the TRD §10.2 matrix. src/config/env.js validates these
    # names through Zod and exits 1 on a miss, so a variable named here that the
    # matrix does not define is not a harmless extra — REDIS_HOST/PORT/PASSWORD/
    # DATABASE previously stood in for a required REDIS_URL, which meant the
    # process died at boot before any assertion ran.
    # CLOUDINARY_URL is deliberately absent: STORAGE_PROVIDER=s3 selects the
    # AWS_* branch, and no environment needs both credential sets.
    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: error
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      SWAGGER_ENABLED: false
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edusphere_test_db?schema=public
      REDIS_URL: redis://localhost:6379
      # The Day 15 setup reads these exact names. Supplying only DATABASE_URL
      # makes every integration test resolve undefined.
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/edusphere_test_db?schema=public
      REDIS_URL_TEST: redis://localhost:6379/1
      JWT_SECRET: ci_test_jwt_access_secret_key_min_32_chars
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_min_32_chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      STORAGE_PROVIDER: s3
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: test-bucket
      EMAIL_PROVIDER: brevo
      EMAIL_API_KEY: test_api_key
      EMAIL_FROM: noreply@test.local
      EMAIL_FROM_NAME: EduSphere Test
      # The Day 11 webhook signature test cannot construct an HMAC without this.
      EMAIL_WEBHOOK_SECRET: ci_test_webhook_hmac_secret

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate

    - name: Run database migrations
      run: npx prisma migrate deploy

    - name: Seed test database
      run: npm run db:seed

    - name: Run Linter
      run: npm run lint

    - name: Run Tests & Coverage
      run: npm run test:run
